[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../sinjoh-treasury-vault/lib"]
allow_paths = [
    "../sinjoh-liquidity-manager/lib",
    "../sinjoh-funding-bands",
    "../sinjoh-launchpad-adapters",
    "../sinjoh-fee-router",
]
remappings = [
    "@sinjoh-v2/=src/",
    "@openzeppelin/contracts/=../sinjoh-treasury-vault/lib/openzeppelin-contracts/contracts/",
    "@uniswap/v3-core/=../sinjoh-liquidity-manager/lib/v3-core/",
    "@uniswap/v3-periphery/=../sinjoh-liquidity-manager/lib/v3-periphery/",
    "@uniswap/v4-core/=../sinjoh-liquidity-manager/lib/v4-periphery/lib/v4-core/",
    "@uniswap/v4-periphery/=../sinjoh-liquidity-manager/lib/v4-periphery/",
    "permit2/=../sinjoh-liquidity-manager/lib/v4-periphery/lib/permit2/",
    "sinjoh-funding-bands/=../sinjoh-funding-bands/",
    "sinjoh-launchpad-adapters/=../sinjoh-launchpad-adapters/",
    "sinjoh-fee-router/=../sinjoh-fee-router/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./sdk/fixtures" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
